<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
      .wordmark { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; }
      .tagline { font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 500; }
    ]]></style>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Icon mark: code brackets merging into a wave -->
  <g transform="translate(60,60)">
    <path d="M 40 10 L 10 45 L 10 55 L 40 90"
          fill="none" stroke="url(#waveGrad)" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 140 10 L 170 45 L 170 55 L 140 90"
          fill="none" stroke="url(#waveGrad)" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 55 55 Q 70 30, 85 55 T 115 55 T 145 55"
          fill="none" stroke="url(#waveGrad)" stroke-width="10"
          stroke-linecap="round"/>
    <circle cx="90" cy="55" r="6" fill="#06B6D4"/>
  </g>

  <!-- Wordmark -->
  <text x="290" y="145" class="wordmark" font-size="72" fill="url(#textGrad)" letter-spacing="-1">Code<tspan fill="#2563EB">wave</tspan></text>

  <!-- Tagline -->
  <text x="292" y="180" class="tagline" font-size="19" fill="#64748B" letter-spacing="3">IT SOLUTIONS &amp; WEB DEVELOPMENT</text>
</svg>
